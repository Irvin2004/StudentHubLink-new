<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css/styles2.css">
  
</head>
<body>
    <div class="login-container">
        <h1>StudentHub</h1>
        <p>Login to your account</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input id="loginEmail" type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input id="loginPassword" type="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                Login
            </button>
            <p id="loginMessage" class="form-message" aria-live="polite"></p>
        </form>

        <div class="register-link">
            <p>
                Don't have an account?
                <a href="register.html">Register</a>
            </p>
        </div>
    </div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
