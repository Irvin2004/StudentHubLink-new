<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudentHub Resource Details</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css/styles_register.css">
<link rel="stylesheet" href="../css/theme.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <h2>StudentHub</h2>
    </div>

    <ul class="nav-links">
        <li><a href="../dashboard.html">Dashboard</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="documents.html">Documents</a></li>
        <li><a href="upload.html">Upload</a></li>
        <li><a href="profile.html">Profile</a></li>
    </ul>
</nav>

<div class="container">
    <div class="resource-detail" id="resourceDetails">
        <h1 id="detailTitle">Loading resource...</h1>
        <p id="detailDescription"></p>

        <div class="detail-list">
            <p><strong>Category:</strong> <span id="detailCategory"></span></p>
            <p><strong>Uploader:</strong> <span id="detailUploader"></span></p>
            <p><strong>Price:</strong> <span id="detailPrice"></span></p>
            <p><strong>Downloads:</strong> <span id="detailDownloads">0</span></p>
            <p><strong>Status:</strong> <span id="detailStatus"></span></p>
        </div>

        <button id="resourceActionBtn" class="download-btn" type="button">
            Download
        </button>
    </div>
</div>

<script type="module" src="../js/auth.js"></script>
<script type="module" src="../js/resources.js"></script>
</body>
</html>
