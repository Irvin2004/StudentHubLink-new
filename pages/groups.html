<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Groups | StudentHub</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/studenthub.css?v=20260723-10">
</head>
<body data-page="groups">
    <div class="groups-shell">
        <aside
            id="primaryNavigationDrawer"
            class="groups-sidebar app-sidebar"
            data-navigation-drawer
            aria-label="StudentHub navigation">
            <a class="groups-brand" href="../dashboard.html">
                <img src="../assets/favicon.svg" alt="">
                <span>StudentHub</span>
            </a>

            <nav class="groups-nav sidebar-nav" aria-label="Primary navigation">
                <a class="sidebar-link" href="../dashboard.html">
                    <span class="sidebar-icon" aria-hidden="true">&#8962;</span>
                    <span class="sidebar-label">Dashboard</span>
                </a>
                <a class="sidebar-link" href="resources.html">
                    <span class="sidebar-icon" aria-hidden="true">&#128722;</span>
                    <span class="sidebar-label">Marketplace</span>
                </a>
                <a class="sidebar-link active" href="groups.html" aria-current="page">
                    <span class="sidebar-icon" aria-hidden="true">&#128101;</span>
                    <span class="sidebar-label">Study Groups</span>
                </a>
                <a class="sidebar-link" href="messages.html">
                    <span class="sidebar-icon" aria-hidden="true">&#128172;</span>
                    <span class="sidebar-label">Messages</span>
                </a>
                <a class="sidebar-link" href="library.html">
                    <span class="sidebar-icon" aria-hidden="true">&#128218;</span>
                    <span class="sidebar-label">My Library</span>
                </a>
                <a class="sidebar-link" href="profile.html">
                    <span class="sidebar-icon" aria-hidden="true">&#128100;</span>
                    <span class="sidebar-label">Profile</span>
                </a>
            </nav>

            <div class="groups-sidebar-footer">
                <button
                    class="theme-toggle"
                    type="button"
                    data-theme-toggle
                    aria-label="Switch color theme">
                    Dark
                </button>
                <span>Choose your theme</span>
            </div>
        </aside>

        <button
            class="navigation-drawer-backdrop"
            type="button"
            data-navigation-drawer-backdrop="primaryNavigationDrawer"
            aria-label="Close navigation"
            hidden>
        </button>

        <main class="groups-main">
            <header class="groups-mobile-header">
                <button
                    class="navigation-drawer-toggle"
                    type="button"
                    data-navigation-drawer-toggle="primaryNavigationDrawer"
                    aria-label="Open navigation">
                    &#9776;
                </button>
                <a class="groups-brand" href="../dashboard.html">
                    <img src="../assets/favicon.svg" alt="">
                    <span>StudentHub</span>
                </a>
                <a href="../dashboard.html">Dashboard</a>
            </header>

            <section class="groups-heading">
                <div>
                    <h1>Study Groups</h1>
                    <p>Find your people. Learn together.</p>
                </div>

                <a class="btn btn-primary" href="../dashboard.html#createGroupModal">
                    Create a group
                </a>
            </section>

            <section class="groups-toolbar" aria-label="Find study groups">
                <label class="groups-search" for="groupSearch">
                    <svg
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>
                    <span class="sr-only">Search study groups</span>
                    <input
                        id="groupSearch"
                        type="search"
                        placeholder="Search by group, subject, code, or tag..."
                        autocomplete="off">
                </label>

                <label class="groups-filter" for="moduleFilter">
                    <span>Subject</span>
                    <select id="moduleFilter">
                        <option value="">All subjects</option>
                    </select>
                </label>
            </section>

            <div class="groups-results-heading">
                <h2>Explore groups</h2>
                <p id="groupResultCount" aria-live="polite">Loading groups...</p>
            </div>

            <section
                id="groupList"
                class="group-grid"
                aria-live="polite"
                aria-busy="true">
                <div class="group-card-skeleton"></div>
                <div class="group-card-skeleton"></div>
                <div class="group-card-skeleton"></div>
            </section>
        </main>
    </div>

    <script type="module" src="../js/controllers/groups-controller.js?security=1"></script>
    <script type="module" src="../js/theme.js?responsive=3"></script>
</body>
</html>
