<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>StudentHub Leaderboard</title>
        <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    </head>
    <body data-page="leaderboard">
        <main class="leaderboard-page">
            <section class="page-header">
                <h1>Leaderboard</h1>
                <p>Top contributors on StudentHub.</p>
            </section>

            <section class="leaderboard-grid">
                <div class="leaderboard-card">
                    <h2>Top Contributors</h2>
                    <div id="topContributors"></div>
                </div>

                <div class="leaderboard-card">
                    <h2>Most Downloaded Resources</h2>
                    <div id="topResources"></div>
                </div>
            </section>
        </main>

        <script type="module" src="../js/pages/leaderboard-page.js"></script>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
