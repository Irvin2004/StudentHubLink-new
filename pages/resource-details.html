<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Resource Details</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../css/base/reset.css">
    <link rel="stylesheet" href="../css/base/theme.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/pages/resources.css">
    <link rel="stylesheet" href="../css/pages/resource-details.css">
</head>
<body>
<main class="resource-details-page">
    <section class="resource-details-card">
        <a href="resources.html" class="back-link">&lt; Back to Marketplace</a>

        <span id="resourceCategory" class="resource-category">Category</span>

        <h1 id="resourceTitle">Resource title</h1>

        <p id="resourceDescription">Resource description</p>

        <div class="resource-details-meta">
            <p><strong>Author:</strong> <a id="resourceOwner" href="#">Unknown</a></p>
            <p><strong>Price:</strong> <span id="resourcePrice">FREE</span></p>
            <p><strong>Downloads:</strong> <span id="resourceDownloads">0</span></p>
            <p><strong>Status:</strong> <span id="resourceStatus">Approved</span></p>
        </div>

        <div class="resource-details-actions">
            <button class="secondary-btn" id="previewBtn" type="button">Preview</button>
            <button class="primary-btn" id="resourceActionBtn" type="button">Download</button>
        </div>
    </section>

    <section class="related-section">
        <h2>Related Resources</h2>

        <div id="relatedResources" class="resource-grid"></div>
    </section>
</main>

<script type="module" src="../js/service/resource-details.js"></script>
</body>
</html>
