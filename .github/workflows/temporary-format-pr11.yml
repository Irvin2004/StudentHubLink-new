name: Temporary PR 11 formatter

on:
  push:
    branches:
      - security/firestore-user-data-hardening
    paths:
      - .github/workflows/temporary-format-pr11.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/firestore-user-data-hardening
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format the three failing files with the locked Prettier version
        run: npx --no-install prettier --version && npx --no-install prettier --write docs/DEPLOYMENT.md js/pages/auth-page.js src/utils/public-profile-projection.js
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEPLOYMENT.md js/pages/auth-page.js src/utils/public-profile-projection.js
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier formatting to PR 11"
            git push origin HEAD:security/firestore-user-data-hardening
          else
            echo "No formatting changes required."
          fi
