name: Format migration files

on:
  push:
    branches:
      - security/firestore-user-data-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/firestore-user-data-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/DEPLOYMENT.md functions/scripts/public-profile-migration.js
      - name: Commit formatted files
        env:
          HUSKY: 0
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/DEPLOYMENT.md functions/scripts/public-profile-migration.js
            git commit -m "Format public profile migration files"
            git pull --rebase origin security/firestore-user-data-hardening
            git push origin HEAD:security/firestore-user-data-hardening
          fi
