name: StudentHub CI

on:
    pull_request:
    push:
        branches: [main, develop]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Lint, test, and build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            VITE_FIREBASE_API_KEY: ci-placeholder
            VITE_FIREBASE_AUTH_DOMAIN: ci.example.invalid
            VITE_FIREBASE_PROJECT_ID: studenthub-ci
            VITE_FIREBASE_STORAGE_BUCKET: studenthub-ci.example.invalid
            VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
            VITE_FIREBASE_APP_ID: "1:000000000000:web:ci"
            VITE_FIREBASE_MEASUREMENT_ID: G-CI

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run complete quality gate
              run: npm run check
