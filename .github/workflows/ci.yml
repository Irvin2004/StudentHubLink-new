name: CI

on:
    pull_request:
    push:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            VITE_FIREBASE_API_KEY: ci-placeholder
            VITE_FIREBASE_AUTH_DOMAIN: ci.example.invalid
            VITE_FIREBASE_PROJECT_ID: studenthub-ci
            VITE_FIREBASE_STORAGE_BUCKET: studenthub-ci.example.invalid
            VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
            VITE_FIREBASE_APP_ID: "1:000000000000:web:ci"
            VITE_FIREBASE_MEASUREMENT_ID: G-CI

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Run tests
              run: npm test

            - name: Validate production build
              run: npm run build
